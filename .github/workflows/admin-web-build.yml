name: Admin Web Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/firebase-hosted-admin-console]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check admin console
        run: bun run lint
      - name: Build admin console
        run: bun run build
