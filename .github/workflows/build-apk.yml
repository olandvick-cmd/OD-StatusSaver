name: Build OD Status Saver APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission for Gradlew (if present)
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Generating fallback google-services.json for CI..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "421596270212",
              "project_id": "od-status-saver",
              "storage_bucket": "od-status-saver.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:421596270212:android:6e4b8595a86a60db2fa15c",
                  "android_client_info": {
                    "package_name": "com.odstatussaver.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyD-sampleFirebaseApiKeyForConfig"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1,
                    "other_platform_oauth_client": []
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:421596270212:android:6e4b8595a86a60db2fa15d",
                  "android_client_info": {
                    "package_name": "com.odstatussaver.app.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyD-sampleFirebaseApiKeyForConfig"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1,
                    "other_platform_oauth_client": []
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: od-status-saver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
