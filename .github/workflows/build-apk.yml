name: Build OD Status Saver APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Unit-test and debug-build jobs do not need live Firebase services.
      # This temporary config exists only on the GitHub runner and is never committed.
      # It registers both debug and release application IDs so the Google Services
      # Gradle plugin can process the debug variant without production credentials.
      - name: Configure CI-only Firebase placeholder
        env:
          FIREBASE_PROD_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$FIREBASE_PROD_CONFIG" ]; then
            echo "Using supplied Firebase configuration."
            printf '%s' "$FIREBASE_PROD_CONFIG" > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Using repository-provided Firebase configuration."
          else
            echo "::notice::No Firebase config supplied; creating a temporary CI-only placeholder. Firebase runtime services will not be available in this APK."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "od-status-saver-ci-only",
              "storage_bucket": "od-status-saver-ci-only.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "com.odstatussaver.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_API_KEY"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000002",
                  "android_client_info": {
                    "package_name": "com.odstatussaver.app.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_API_KEY"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: od-status-saver-ci-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
